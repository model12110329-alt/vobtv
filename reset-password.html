<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>비밀번호 재설정 · VoB TV</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#102d48;font:17px/1.6 system-ui,sans-serif}main{width:min(520px,calc(100% - 32px));margin:8vh auto;padding:32px;background:white;border-radius:18px;box-shadow:0 8px 40px #102d4812}h1{font-size:27px;line-height:1.4}label{display:block;margin:18px 0 6px;font-weight:600}input{width:100%;font:inherit;padding:12px;border:1px solid #9baeb5;border-radius:8px}button,.link{display:inline-block;margin:22px 0 0;padding:12px 18px;border:0;border-radius:8px;background:#126064;color:white;font:inherit;text-decoration:none;cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:#126064}small{display:block;margin-top:8px;color:#536974}[hidden]{display:none!important}.notice{white-space:pre-line;padding-top:12px}.brand{color:#126064;font-weight:700}.error{color:#a42525}
</style>
</head>
<body><main>
<p class="brand">VoB TV · 춘천 쉬운 뉴스</p>
<h1>관리자 비밀번호 재설정</h1>
<p id="checking" role="status">연결을 확인하고 있습니다…</p>
<section id="requestSection" hidden>
<p>등록된 이메일로 비밀번호 재설정 링크를 받으세요.</p>
<form id="requestForm"><label for="resetEmail">이메일</label><input id="resetEmail" type="email" autocomplete="username" required maxlength="254"><button id="sendReset" type="submit">재설정 메일 받기</button></form>
</section>
<section id="passwordSection" hidden>
<p>새 비밀번호를 입력해 주세요.</p>
<form id="passwordForm"><label for="newPassword">새 비밀번호</label><input id="newPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><small>12자 이상 입력해 주세요.</small><label for="confirmPassword">새 비밀번호 확인</label><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><button id="savePassword" type="submit">새 비밀번호 저장</button></form>
</section>
<p id="resetMessage" class="notice" role="status" aria-live="polite"></p>
<p><a href="admin.html">관리자 로그인으로 돌아가기</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/reset-password.js?v=20261107-1"></script>
</body></html>
