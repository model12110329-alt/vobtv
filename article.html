<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VoB TV 기사</title>
<meta name="description" content="VoB TV · 바른 시선, 당당한 목소리. 대한민국 시사 저널 방송">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,900&family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&family=Chakra+Petch:wght@500;700&display=swap">
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="logo" href="index.html"><span class="l3d"><img src="assets/logo3d.png" alt="VoB TV" width="178" height="40"></span><small>Victory Begins with Our Voice</small></a>
    <nav aria-label="분야">
      <a href="index.html">홈</a><a href="index.html#newsSec">뉴스</a>
    </nav>
    <span class="clock" id="clock">--:--:--</span>
  </div>
</header>

<main class="wrap">
  <article class="article" id="article">
    <p class="empty">기사를 불러오는 중입니다.</p>
  </article>
</main>

<footer><div class="wrap">© 2026 VoB TV · 바른 시선, 당당한 목소리</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clock = document.getElementById("clock");
// 한국 시간 기준: 2026년 10월 5일 (월) 21시 12분 54초
const fmtClock = new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"long",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
const tick = ()=>{ const p = Object.fromEntries(fmtClock.formatToParts(new Date()).map(x=>[x.type,x.value]));
  clock.textContent = `${p.year}년 ${p.month} ${p.day}일 (${p.weekday}) ${p.hour}시 ${p.minute}분 ${p.second}초`; };
tick(); setInterval(tick, 1000);
(async()=>{
  const box = document.getElementById("article");
  const id = new URLSearchParams(location.search).get("id");
  try{
    const n = id && await VOB.article(id);
    if(!n){ box.innerHTML = `<p class="empty">기사를 찾지 못했습니다.</p><a class="back" href="index.html">← 첫 화면으로</a>`; return; }
    document.title = n.title + " · VoB TV";
    const body = (n.body || n.summary || "").split(/\n{2,}|\r\n\r\n/).map(p=>`<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join("");
    box.innerHTML = `<div class="meta">${esc(n.section||"")} · ${new Date(n.published_at).toLocaleString("ko-KR",{dateStyle:"long",timeStyle:"short"})}</div>
      <h1>${esc(n.title)}</h1>
      ${n.image_url?`<figure class="art-img"><img src="${esc(n.image_url)}" alt="">${n.auto?`<figcaption>AI로 생성한 이미지입니다</figcaption>`:""}</figure>`:""}
      <div class="body">${body}</div>
      ${(n.sources||[]).length?`<p class="sources">참고: ${esc([...new Set(n.sources.map(x=>x.name).filter(Boolean))].join(", "))}</p>`:""}
      <a class="back" href="index.html">← 첫 화면으로</a>`;
  }catch(e){ box.innerHTML = `<p class="empty">기사를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>`; }
})();
</script>
</body>
</html>
